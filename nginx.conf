events {
    worker_connections 1024;
}

http {
    upstream auth_service {
        server auth-service:8000;
    }
    
    upstream roles_service {
        server roles-service:8001;
    }
    
    upstream canchas_service {
        server canchas-service:8002;
    }

    server {
        listen 80;
        
        # Configuracion CORS
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Origin, X-Requested-With' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        
     
        location /api/ {
            if ($request_method = 'OPTIONS') {
                return 204;
            }
            
       
            return 404;
        }

        # Rutas de autenticación → auth-service
        location /api/auth/ {
            if ($request_method = 'OPTIONS') {
                return 204;
            }
            proxy_pass http://auth_service/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Rutas de roles → roles-service  
        location /api/roles/ {
            if ($request_method = 'OPTIONS') {
                return 204;
            }
            proxy_pass http://roles_service/roles/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Rutas de permisos → roles-service
        location /api/permissions/ {
            if ($request_method = 'OPTIONS') {
                return 204;
            }
            proxy_pass http://roles_service/permissions/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Rutas de perfil de usuario → roles-service
        location /api/user/ {
            if ($request_method = 'OPTIONS') {
                return 204;
            }
            proxy_pass http://roles_service/user/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Rutas de permisos de usuario → roles-service
        location /api/user-permissions/ {
            if ($request_method = 'OPTIONS') {
                return 204;
            }
            proxy_pass http://roles_service/user-permissions/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Rutas de gestion de usuarios (admin) → roles-service
        location /api/admin/ {
            if ($request_method = 'OPTIONS') {
                return 204;
            }
            proxy_pass http://roles_service/admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Rutas de canchas → canchas-service
        location /api/canchas/ {
            if ($request_method = 'OPTIONS') {
                return 204;
            }
            proxy_pass http://canchas_service/canchas/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Rutas de reservas → canchas-service
        location /api/reservas/ {
            if ($request_method = 'OPTIONS') {
                return 204;
            }
            proxy_pass http://canchas_service/reservas/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Nuevas rutas de disponibilidad → canchas-service
        location /api/canchas/disponibilidad/ {
            if ($request_method = 'OPTIONS') {
                return 204;
            }
            proxy_pass http://canchas_service/canchas/disponibilidad/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Nuevas rutas de días especiales → canchas-service
        location /api/canchas/dias-especiales/ {
            if ($request_method = 'OPTIONS') {
                return 204;
            }
            proxy_pass http://canchas_service/canchas/dias-especiales/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check
        location /health {
            return 200 "API Gateway OK";
            add_header Content-Type text/plain;
        }
    }
}
