version: "3.9"

services:
  # Servicio de Autenticación
  auth-service:
    build:
      context: ./auth_service
      dockerfile: Dockerfile
    container_name: auth-service
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql+pymysql://root:rootpass@auth_mysql:3306/auth
      - SECRET_KEY=tu_clave_super_segura
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - RABBITMQ_URL=amqp://admin:admin@rabbitmq:5672/
    depends_on:
      auth_mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./auth_service/app:/app
    working_dir: /app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # Servicio de Roles
  roles-service:
    build:
      context: ./roles_service
      dockerfile: Dockerfile
    container_name: roles-service
    restart: always
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=mysql+pymysql://root:rootpass@roles_mysql:3306/roles_service
      - SECRET_KEY=tu_clave_super_segura
    depends_on:
      roles_mysql:
        condition: service_healthy
    volumes:
      - ./roles_service/app:/app
    working_dir: /app
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload

  # Base de datos para Auth Service
  auth_mysql:
    image: mysql:8.0
    container_name: auth-mysql-db
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpass  
      MYSQL_DATABASE: auth
      MYSQL_USER: myuser
      MYSQL_PASSWORD: mypass
    volumes:
      - auth_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Base de datos para Roles Service
  roles_mysql:
    image: mysql:8.0
    container_name: roles-mysql-db
    restart: always
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: roles_service
      MYSQL_USER: roles_user
      MYSQL_PASSWORD: rolespass
    volumes:
      - roles_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # PHPMyAdmin para Auth Service
  auth_phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: auth-phpmyadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: auth_mysql
      MYSQL_ROOT_PASSWORD: rootpass
    depends_on:
      - auth_mysql

  # PHPMyAdmin para Roles Service
  roles_phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: roles-phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: roles_mysql
      MYSQL_ROOT_PASSWORD: rootpass
    depends_on:
      - roles_mysql

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-server
    restart: always
    ports:
      - "5672:5672"     # Puerto AMQP
      - "15672:15672"   # Interfaz web http://localhost:15672
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # API Gateway con Nginx
  api-gateway:
    image: nginx:alpine
    container_name: api-gateway
    restart: always
    ports:
      - "3001:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - roles-service
      - canchas-service
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Servicio de Canchas
  canchas-service:
    build:
      context: ./canchas_service
      dockerfile: Dockerfile
    container_name: canchas-service
    restart: always
    ports:
      - "8002:8002"
    environment:
      - DATABASE_URL=mysql+pymysql://root:rootpass@canchas_mysql:3306/canchas_service
      - SECRET_KEY=tu_clave_super_segura
      - ALGORITHM=HS256
      - AUTH_SERVICE_URL=http://auth-service:8000
    depends_on:
      canchas_mysql:
        condition: service_healthy

  # Base de datos para el servicio de canchas
  canchas_mysql:
    image: mysql:8.0
    container_name: canchas-mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: canchas_service
    ports:
      - "3309:3306"
    volumes:
      - canchas_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

volumes:
  auth_mysql_data:
  roles_mysql_data:
  canchas_mysql_data:
  rabbitmq_data:

networks:
  default:
    driver: bridge